name: Quarto Publish

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    # required perms for Pages pipeline
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read   # required by deploy-pages@v4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # If you render R content, uncomment:
      # - name: Setup R
      #   uses: r-lib/actions/setup-r@v2

      - name: Render
        run: quarto render

      # Upload the site artifact for Pages (NOT upload-artifact)
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs   # change to your Quarto output dir (e.g. docs)

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
