project:
  type: book
  output-dir: docs    # GitHub Pages looks for a "docs" folder by default
  resources:
    - figures/repbc_2026-10-01/**   # PNG/PDF/CSV files offered as downloads
    - "!figures/repbc_2026-10-01/**/*.rds"   # analysis caches are not published

book:
  title: "DMET results"
  author: "Teresa McGee"
  date: today
  chapters:
    - index.qmd
    - intro.qmd
    - overview.qmd
    - status.qmd
    - credible_intervals.qmd
    - part: "Protein Analyses"
      chapters:
        - ATPase.qmd
        - Abcb4.qmd
        - Bcrp.qmd
        - Bsep.qmd
        - Ces1.qmd
        - Cyp1a2.qmd
        - Cyp2c29.qmd
        - Cyp2c39.qmd
        - Cyp2c50.qmd
        - Cyp2c9.qmd
        - Cyp2d10.qmd
        - Cyp2d26.qmd
        - Cyp2d9.qmd
        - Cyp2e1.qmd
        - Cyp2f2.qmd
        - Cyp3a11.qmd
        - Ent1.qmd
        - Mrp2.qmd
        - Mrp3.qmd
        - Ntcp.qmd
        - Oatp1a4.qmd
        - Oatp2a1.qmd
        - Oct1.2.qmd
        - Ugt1a1.qmd
        - Ugt1a6.qmd
        - Ugt2a2.qmd
    - references.qmd

format:
  html:
    theme: cosmo          # Bootswatch theme (cosmo, flatly, lumen, etc.)
    css: styles.css       # download lines under figures
    toc: true             # enable table of contents in sidebar
    toc-location: left
    number-sections: true # auto-number sections
    code-fold: true       # allow folding code blocks
    code-summary: "Show code"

execute:
  error: true
